<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fruit Rink">
<meta name="theme-color" content="#2aa7e6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Fruit Rink</title>
<style>
:root{ --ink:#3a2413; --coral:#f2553d; --cream:#fff7e6; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#2aa7e6;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;color:#fff;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:absolute;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#hud{
  position:absolute;left:0;right:0;top:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);
  height:calc(env(safe-area-inset-top,0px) + 66px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
}
.side{display:flex;gap:8px;align-items:center}
.side.right{justify-content:flex-end}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.chip{background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 4px 14px rgba(0,60,100,.15);border-radius:13px}
.icon{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;color:#0d4766}
.icon:active{background:rgba(255,255,255,.55)}
.icon svg{width:20px;height:20px}
.icon.armed{background:var(--coral);color:#fff;box-shadow:none}
#scorebox{text-align:center;line-height:1;text-shadow:0 2px 0 rgba(8,70,110,.35),0 0 16px rgba(8,70,110,.3)}
#score{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;transition:transform .12s}
#score.bump{transform:scale(1.12)}
#best{font-size:12px;opacity:.9;margin-top:4px;font-variant-numeric:tabular-nums;font-weight:600}
.lbl{font-size:12px;font-weight:600;text-shadow:0 1px 0 rgba(8,70,110,.4)}
#next{width:44px;height:44px;display:block}
#over{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,50,80,.45);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:5}
#over.show{display:grid}
.card{width:min(320px,86vw);background:var(--cream);color:var(--ink);border-radius:26px;padding:28px 24px 24px;text-align:center;
  box-shadow:0 20px 60px rgba(0,30,60,.35), inset 0 -6px 0 rgba(120,70,20,.1)}
.card h2{font-size:26px;font-weight:800}
.card p{font-size:15px;color:#7a5a3a;margin-top:6px;line-height:1.4}
.final{font-size:52px;font-weight:800;margin-top:14px;font-variant-numeric:tabular-nums;line-height:1}
.sub{font-size:14px;color:#7a5a3a;margin-top:6px}
.play{margin-top:22px;width:100%;padding:15px 0;border-radius:16px;background:var(--coral);color:#fff;font-size:18px;font-weight:700;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.play:active{transform:translateY(1px)}
@media (prefers-reduced-motion: reduce){#score{transition:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="probe"></div>

<div id="hud">
  <div class="side">
    <button class="icon chip" id="restart" aria-label="Restart game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
    <button class="icon chip" id="sound" aria-label="Toggle sound">
      <svg id="snd-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg id="snd-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
  <div id="scorebox"><div id="score">0</div><div id="best">Best 0</div></div>
  <div class="side right"><span class="lbl">Next</span><canvas id="next" class="chip"></canvas></div>
</div>

<div id="over" role="dialog" aria-modal="true" aria-labelledby="over-title">
  <div class="card">
    <h2 id="over-title">Game over</h2>
    <p>A fruit came to rest past the red line.</p>
    <div class="final" id="final">0</div>
    <div class="sub" id="final-sub">Best 0</div>
    <button class="play" id="again">Play again</button>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;

/* ================= Tunables ================= */
const LV = [                                  // index 0..9, shown as level 1..10
  { n:'cherry',     r:17, j:'#e3143a' },
  { n:'strawberry', r:21, j:'#f2283c' },
  { n:'grapes',     r:26, j:'#8a4be0' },
  { n:'lemon',      r:31, j:'#ffe52e' },
  { n:'orange',     r:36, j:'#ff9d1e' },
  { n:'apple',      r:41, j:'#f0333a' },
  { n:'peach',      r:47, j:'#ffa47a' },
  { n:'pineapple',  r:53, j:'#f0b429' },
  { n:'coconut',    r:59, j:'#f7f1e6' },
  { n:'watermelon', r:66, j:'#ff4d5e' },
];
const TOP = LV.length - 1;
const W = 400, H = 780;               // table size in world units (fixed for consistent play)
const ZONE = 140, FOUL = H - ZONE, LAUNCH_Y = H - ZONE * 0.52;
const mass = l => Math.pow(2, l);     // each level doubles; a merge conserves mass exactly

const DRAG = 0.75;        // exponential decay /s  (was 0.55)
const DECEL = 80;         // constant friction u/s^2 (was 55)
const BACK_DRAG = 8.0;    // extra decay on velocity toward the player: fruit gathers at the back
const STOP = 4;
const WALL_E = 0.6, BACK_E = 0.12, FRONT_E = 0.3, BALL_E = 0.72;
const MERGE_KEEP = 0.92, POP = 120;
const MIN_PULL = 16, FULL_PULL = 170;
const VMIN = 380, VMAX = 1650;
const DANGER_T = 2.2;
const SPAWN_W = [0.45, 0.35, 0.20];

/* view */
const TILT = 0.28;        // far edge drawn at 1/(1+TILT) of near width
const RAIL = 16, RAIL_H = 9, BODY = 16;

/* ================= DOM & state ================= */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const probe = document.getElementById('probe');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const nextCv = document.getElementById('next'), overEl = document.getElementById('over');

let dpr = 1, vw = 0, vh = 0, U = 1, cx = 0, hz = 0, L = 1, Tn = 0, Tf = 0;
let bg = null, spr = [], shadowSpr = null;
let items = [], spawned = [], particles = [], floaters = [];
let held = null, heldX = W / 2, nextLv = 0, drag = null, pointerId = null;
let score = 0, best = 0, cleared = 0, combo = 0, gameT = 0, launchT = -10, lastLaunch = null, shots = 0;
let state = 'play', muted = false;
try { best = +localStorage.getItem('fruitRinkBest') || 0; muted = localStorage.getItem('fruitRinkMuted') === '1'; } catch (e) {}

/* ================= Helpers ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rndLv() { let r = Math.random(); for (let i = 0; i < SPAWN_W.length; i++) if ((r -= SPAWN_W[i]) < 0) return i; return 0; }
function mkItem(lv, x, y, vx, vy) {
  return { lv, x, y, vx, vy, r: LV[lv].r, m: mass(lv), dead: false, danger: 0, crossed: false, born: gameT, pop: 1,
           a: (Math.random() - 0.5) * 0.6, w: 0 };
}

/* perspective: world (x,y) -> screen */
const sOf = y => 1 / (1 + TILT * (H - y) / H);
function P(x, y, lift = 0) { const s = sOf(y); return { x: cx + (x - W / 2) * U * s, y: hz + L * s - lift * U * s, s }; }
function yFromScreen(sy) { const s = clamp((sy - hz) / L, 0.5, 1.2); return H - (1 / s - 1) * H / TILT; }

/* ================= Audio ================= */
let actx = null, lastHit = 0;
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, dur, type = 'sine', vol = 0.15, slide = 1, delay = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
}
function hitSound(speed) {
  const now = performance.now();
  if (now - lastHit < 45 || speed < 90) return;
  lastHit = now;
  tone(150 + Math.random() * 40, 0.06, 'sine', clamp(speed / 3000, 0.02, 0.14), 0.6);
}

/* ================= Fruit art ================= */
function radial(g, r, stops, ox = -0.35, oy = -0.4) {
  const gr = g.createRadialGradient(r * ox, r * oy, r * 0.05, 0, 0, r * 1.08);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}
function gloss(g, r, a = 0.55, x = -0.34, y = -0.42, s = 0.32) {
  const gr = g.createRadialGradient(r * x, r * y, 0, r * x, r * y, r * s);
  gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(r * x, r * y, r * s, 0, TAU); g.fill();
}
function leaf(g, x, y, len, ang, c1 = '#6fd46a', c2 = '#2f8a3c') {
  g.save(); g.translate(x, y); g.rotate(ang);
  const gr = g.createLinearGradient(0, -len * 0.3, 0, len * 0.3);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr;
  g.beginPath(); g.moveTo(0, 0);
  g.bezierCurveTo(len * 0.3, -len * 0.42, len * 0.75, -len * 0.3, len, 0);
  g.bezierCurveTo(len * 0.75, len * 0.3, len * 0.3, len * 0.42, 0, 0); g.fill();
  g.strokeStyle = 'rgba(20,70,30,.45)'; g.lineWidth = Math.max(0.6, len * 0.045);
  g.beginPath(); g.moveTo(len * 0.05, 0); g.quadraticCurveTo(len * 0.5, -len * 0.05, len * 0.9, 0); g.stroke();
  g.restore();
}
function stem(g, x0, y0, qx, qy, x1, y1, w) {
  g.strokeStyle = '#6b4423'; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(qx, qy, x1, y1); g.stroke(); g.lineCap = 'butt';
}

const DRAW = [
  // 0 cherry
  (g, r) => {
    stem(g, r * 0.02, -r * 0.7, r * 0.05, -r * 1.05, r * 0.42, -r * 1.08, r * 0.11);
    leaf(g, r * 0.4, -r * 1.07, r * 0.55, -0.25);
    g.fillStyle = radial(g, r, ['#ff9aa6', '#e3143a', '#8e0020', '#4d0010']);
    g.beginPath(); g.arc(0, r * 0.05, r * 0.93, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(80,0,15,.45)'; g.lineWidth = r * 0.06;
    g.beginPath(); g.arc(r * 0.02, -r * 0.74, r * 0.14, 0.4, Math.PI - 0.4); g.stroke();
    gloss(g, r, 0.8, -0.36, -0.28, 0.3);
  },
  // 1 strawberry
  (g, r) => {
    g.beginPath(); g.moveTo(0, -r * 0.72);
    g.bezierCurveTo(r * 0.78, -r * 0.98, r * 1.08, -r * 0.2, r * 0.56, r * 0.45);
    g.quadraticCurveTo(r * 0.22, r * 0.94, 0, r * 0.98);
    g.quadraticCurveTo(-r * 0.22, r * 0.94, -r * 0.56, r * 0.45);
    g.bezierCurveTo(-r * 1.08, -r * 0.2, -r * 0.78, -r * 0.98, 0, -r * 0.72);
    g.fillStyle = radial(g, r, ['#ff9a9a', '#f2283c', '#a50d22', '#6e0716']); g.fill();
    for (let yy = -0.42, row = 0; yy < 0.8; yy += 0.21, row++) {
      const hw = yy < -0.15 ? 0.66 : 0.66 * (1 - (yy + 0.15) / 1.15);
      for (let xx = -hw + 0.1 + (row % 2) * 0.12; xx < hw - 0.08; xx += 0.24) {
        g.save(); g.translate(xx * r, yy * r); g.rotate(xx * 0.6);
        g.fillStyle = '#ffe07a'; g.beginPath(); g.ellipse(0, 0, r * 0.04, r * 0.065, 0, 0, TAU); g.fill();
        g.fillStyle = 'rgba(90,0,10,.35)'; g.beginPath(); g.ellipse(0, r * 0.03, r * 0.05, r * 0.03, 0, 0, TAU); g.fill();
        g.restore();
      }
    }
    gloss(g, r, 0.55, -0.34, -0.3, 0.3);
    for (const a of [-0.15, 0.55, Math.PI / 2, Math.PI - 0.55, Math.PI + 0.15])
      leaf(g, 0, -r * 0.68, r * 0.46, a, '#7ad66a', '#2b8a36');
    stem(g, 0, -r * 0.7, r * 0.02, -r * 0.85, r * 0.08, -r * 0.95, r * 0.09);
  },
  // 2 grapes
  (g, r) => {
    stem(g, 0, -r * 0.6, r * 0.02, -r * 0.9, r * 0.12, -r * 1.06, r * 0.1);
    leaf(g, -r * 0.02, -r * 0.82, r * 0.62, -2.5, '#8fd96a', '#3a8a2a');
    const pts = [[-0.48, -0.4], [0, -0.48], [0.48, -0.4], [-0.46, 0.04], [0, -0.02], [0.46, 0.04], [-0.24, 0.44], [0.24, 0.44], [0, 0.78]];
    for (const [px, py] of pts) {
      g.save(); g.translate(px * r, py * r);
      const gr = r * 0.31;
      g.fillStyle = radial(g, gr, ['#e3c6ff', '#9a57ec', '#52209a', '#2a0c52']);
      g.beginPath(); g.arc(0, 0, gr, 0, TAU); g.fill();
      gloss(g, gr, 0.7, -0.35, -0.38, 0.35);
      g.restore();
    }
  },
  // 3 lemon
  (g, r, rnd) => {
    g.save(); g.rotate(-0.35);
    g.fillStyle = '#e8c000';
    g.beginPath(); g.ellipse(r * 0.95, 0, r * 0.13, r * 0.1, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(-r * 0.95, 0, r * 0.12, r * 0.09, 0, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(-r * 0.97, 0);
    g.bezierCurveTo(-r * 0.9, -r * 0.98, r * 0.9, -r * 0.98, r * 0.97, 0);
    g.bezierCurveTo(r * 0.9, r * 0.98, -r * 0.9, r * 0.98, -r * 0.97, 0);
    g.fillStyle = radial(g, r, ['#fffbd8', '#ffe52e', '#e0b400', '#9a7600']); g.fill();
    g.fillStyle = 'rgba(150,110,0,.22)';
    for (let i = 0; i < 70; i++) { const a = rnd() * TAU, d = Math.sqrt(rnd()) * 0.8; g.beginPath(); g.arc(Math.cos(a) * d * r, Math.sin(a) * d * r * 0.72, r * 0.018, 0, TAU); g.fill(); }
    gloss(g, r, 0.65, -0.3, -0.35, 0.34);
    g.restore();
  },
  // 4 orange
  (g, r, rnd) => {
    g.fillStyle = radial(g, r, ['#ffe0a8', '#ff9d1e', '#e36a00', '#a64300']);
    g.beginPath(); g.arc(0, 0, r * 0.97, 0, TAU); g.fill();
    for (let i = 0; i < 110; i++) {
      const a = rnd() * TAU, d = Math.sqrt(rnd()) * 0.9;
      g.fillStyle = rnd() < 0.5 ? 'rgba(160,60,0,.16)' : 'rgba(255,230,180,.18)';
      g.beginPath(); g.arc(Math.cos(a) * d * r, Math.sin(a) * d * r, r * 0.022, 0, TAU); g.fill();
    }
    gloss(g, r, 0.6);
    g.fillStyle = '#5a7a1a';
    g.beginPath(); g.arc(r * 0.02, -r * 0.6, r * 0.07, 0, TAU); g.fill();
    leaf(g, r * 0.04, -r * 0.62, r * 0.55, -0.55);
  },
  // 5 apple
  (g, r) => {
    stem(g, 0, -r * 0.55, r * 0.02, -r * 0.8, r * 0.1, -r * 1.02, r * 0.09);
    g.beginPath(); g.moveTo(0, -r * 0.62);
    g.bezierCurveTo(r * 0.35, -r * 0.95, r * 1.05, -r * 0.85, r * 0.98, -r * 0.1);
    g.bezierCurveTo(r * 0.95, r * 0.6, r * 0.5, r * 0.98, r * 0.22, r * 0.92);
    g.quadraticCurveTo(0, r * 0.85, -r * 0.22, r * 0.92);
    g.bezierCurveTo(-r * 0.5, r * 0.98, -r * 0.95, r * 0.6, -r * 0.98, -r * 0.1);
    g.bezierCurveTo(-r * 1.05, -r * 0.85, -r * 0.35, -r * 0.95, 0, -r * 0.62);
    g.fillStyle = radial(g, r, ['#ffb3a0', '#f0333a', '#b3141e', '#6a0810']); g.fill();
    g.save(); g.clip();
    let gr = g.createRadialGradient(r * 0.5, r * 0.35, 0, r * 0.5, r * 0.35, r * 0.6);
    gr.addColorStop(0, 'rgba(255,210,80,.4)'); gr.addColorStop(1, 'rgba(255,210,80,0)');
    g.fillStyle = gr; g.fillRect(-r, -r, 2 * r, 2 * r);
    gr = g.createRadialGradient(0, -r * 0.6, 0, 0, -r * 0.6, r * 0.3);
    gr.addColorStop(0, 'rgba(70,0,5,.45)'); gr.addColorStop(1, 'rgba(70,0,5,0)');
    g.fillStyle = gr; g.fillRect(-r, -r, 2 * r, 2 * r);
    g.restore();
    gloss(g, r, 0.6, -0.42, -0.35, 0.3);
    leaf(g, r * 0.06, -r * 0.86, r * 0.5, -0.4);
  },
  // 6 peach
  (g, r) => {
    g.fillStyle = radial(g, r, ['#fff0cf', '#ffc38a', '#ff8a6b', '#d8455e']);
    g.beginPath(); g.arc(0, 0, r * 0.96, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(0, 0, r * 0.96, 0, TAU); g.clip();
    const gr = g.createRadialGradient(r * 0.45, r * 0.1, 0, r * 0.45, r * 0.1, r * 0.8);
    gr.addColorStop(0, 'rgba(230,50,90,.45)'); gr.addColorStop(1, 'rgba(230,50,90,0)');
    g.fillStyle = gr; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
    g.strokeStyle = 'rgba(160,40,50,.3)'; g.lineWidth = r * 0.06;
    g.beginPath(); g.moveTo(r * 0.08, -r * 0.88); g.quadraticCurveTo(-r * 0.3, -r * 0.05, r * 0.02, r * 0.86); g.stroke();
    gloss(g, r, 0.35, -0.35, -0.4, 0.45);
    leaf(g, r * 0.05, -r * 0.84, r * 0.6, -0.7);
    leaf(g, r * 0.02, -r * 0.84, r * 0.45, -2.3);
  },
  // 7 pineapple
  (g, r) => {
    const base = -r * 0.42;
    const crown = [[-1.57, 0.62], [-1.97, 0.52], [-1.17, 0.52], [-2.35, 0.4], [-0.79, 0.4], [-1.77, 0.6], [-1.37, 0.6]];
    const cols = ['#56b84a', '#2d7d33', '#3c9a3c'];
    crown.forEach(([a, l], i) => {
      g.save(); g.translate(0, base); g.rotate(a); const len = l * r, w = r * 0.1;
      g.fillStyle = cols[i % 3];
      g.beginPath(); g.moveTo(0, -w); g.quadraticCurveTo(len * 0.5, -w * 0.8, len, 0); g.quadraticCurveTo(len * 0.5, w * 0.8, 0, w); g.fill();
      g.restore();
    });
    g.save(); g.translate(0, r * 0.22);
    const rb = r * 0.76;
    g.beginPath(); g.ellipse(0, 0, r * 0.68, rb, 0, 0, TAU);
    g.fillStyle = radial(g, rb, ['#ffe890', '#f0b429', '#c07d0a', '#7a4a00'], -0.3, -0.3); g.fill();
    g.clip();
    g.strokeStyle = 'rgba(110,60,0,.55)'; g.lineWidth = r * 0.045;
    const s = r * 0.28;
    for (let k = -8; k <= 8; k++) {
      g.beginPath(); g.moveTo(k * s - r, -r); g.lineTo(k * s + r, r); g.stroke();
      g.beginPath(); g.moveTo(k * s + r, -r); g.lineTo(k * s - r, r); g.stroke();
    }
    g.fillStyle = 'rgba(90,50,0,.6)';
    for (let j = -4; j <= 4; j++) for (let i = -4; i <= 4; i++) {
      g.beginPath(); g.arc(i * s + (j & 1 ? s / 2 : 0), j * s / 2, r * 0.03, 0, TAU); g.fill();
    }
    gloss(g, rb, 0.45, -0.35, -0.35, 0.4);
    g.restore();
  },
  // 8 coconut
  (g, r, rnd) => {
    g.fillStyle = radial(g, r, ['#c2956a', '#8a5a33', '#5a3419', '#2e170a']);
    g.beginPath(); g.arc(0, 0, r * 0.97, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(0, 0, r * 0.97, 0, TAU); g.clip();
    g.lineWidth = r * 0.028;
    for (let i = 0; i < 160; i++) {
      const a = rnd() * TAU, d = Math.sqrt(rnd()) * 0.95, x = Math.cos(a) * d * r, y = Math.sin(a) * d * r, l = r * (0.08 + rnd() * 0.12), t = rnd() * TAU;
      g.strokeStyle = rnd() < 0.55 ? 'rgba(235,195,140,.22)' : 'rgba(30,15,5,.3)';
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(t) * l, y + Math.sin(t) * l * 0.3, x + Math.cos(t) * l * 1.6, y + Math.sin(t) * l); g.stroke();
    }
    g.restore();
    for (const [ex, ey] of [[-0.17, -0.34], [0.17, -0.34], [0, -0.1]]) {
      g.fillStyle = 'rgba(210,170,120,.35)'; g.beginPath(); g.ellipse(ex * r, ey * r + r * 0.015, r * 0.1, r * 0.12, 0, 0, TAU); g.fill();
      g.fillStyle = '#231005'; g.beginPath(); g.ellipse(ex * r, ey * r, r * 0.085, r * 0.105, 0, 0, TAU); g.fill();
    }
    gloss(g, r, 0.22, -0.35, -0.45, 0.4);
  },
  // 9 watermelon
  (g, r) => {
    g.fillStyle = radial(g, r, ['#c4f7a6', '#55c24a', '#23862c', '#0e4d17']);
    g.beginPath(); g.arc(0, 0, r * 0.97, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(0, 0, r * 0.97, 0, TAU); g.clip();
    g.strokeStyle = 'rgba(10,64,20,.8)'; g.lineJoin = 'round';
    for (let i = -4; i <= 4; i++) {
      g.lineWidth = r * 0.12;
      g.beginPath();
      for (let t = -1; t <= 1.001; t += 0.05) {
        const sq = Math.sqrt(Math.max(0, 1 - t * t)), x = i * 0.25 * r * sq + Math.sin(t * 11 + i) * r * 0.03 * sq, y = t * r;
        t === -1 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
    }
    g.restore();
    gloss(g, r, 0.55, -0.34, -0.42, 0.38);
    g.fillStyle = '#6b4423'; g.beginPath(); g.ellipse(0, -r * 0.93, r * 0.07, r * 0.05, 0, 0, TAU); g.fill();
  },
];

function buildSprites() {
  spr = LV.map((Lv, i) => {
    const R = Lv.r * 1.2 + 2, px = Math.ceil(R * 2 * U * dpr);
    const c = document.createElement('canvas'); c.width = c.height = px;
    const g = c.getContext('2d');
    g.scale(px / (R * 2), px / (R * 2)); g.translate(R, R);
    DRAW[i](g, Lv.r, mulberry(i * 101 + 7));
    return { c, R };
  });
  const sp = 64; shadowSpr = document.createElement('canvas'); shadowSpr.width = shadowSpr.height = sp;
  const g = shadowSpr.getContext('2d'), gr = g.createRadialGradient(sp / 2, sp / 2, 0, sp / 2, sp / 2, sp / 2);
  gr.addColorStop(0, 'rgba(50,20,0,.55)'); gr.addColorStop(0.6, 'rgba(50,20,0,.3)'); gr.addColorStop(1, 'rgba(50,20,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, sp, sp);
}

/* ================= Scene ================= */
function poly(c, pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.closePath(); }

function cloud(c, x, y, s) {
  c.fillStyle = 'rgba(255,255,255,.95)';
  for (const [dx, dy, r] of [[-38, 6, 22], [-12, -8, 30], [20, -2, 26], [44, 8, 18], [4, 10, 24]]) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); c.fill(); }
  c.fillStyle = 'rgba(160,210,235,.35)';
  c.beginPath(); c.ellipse(x + 2 * s, y + 20 * s, 56 * s, 8 * s, 0, 0, TAU); c.fill();
}

function palm(c, bx, by, h, lean, rnd) {
  const tx = bx + lean, ty = by - h, qx = bx + lean * 0.15, qy = by - h * 0.55;
  const N = 18;
  for (let i = 0; i <= N; i++) {
    const t = i / N, x = (1 - t) * (1 - t) * bx + 2 * (1 - t) * t * qx + t * t * tx, y = (1 - t) * (1 - t) * by + 2 * (1 - t) * t * qy + t * t * ty;
    const w = 11 - 5 * t;
    c.fillStyle = i % 2 ? '#9a6a36' : '#7e5228';
    c.beginPath(); c.ellipse(x, y, w, h / N * 0.75, 0, 0, TAU); c.fill();
  }
  const fr = h * 0.42;
  const angs = [-2.9, -2.4, -1.95, -1.4, -0.95, -0.45, 0.05, 2.5, 0.6];
  angs.forEach((a, k) => {
    const ex = tx + Math.cos(a) * fr, ey = ty + Math.sin(a) * fr * 0.55 + fr * 0.45;
    const mx = tx + Math.cos(a) * fr * 0.55, my = ty + Math.sin(a) * fr * 0.55 - fr * 0.1;
    c.strokeStyle = k % 2 ? '#1f7a38' : '#2e9b4a'; c.lineCap = 'round';
    for (let t = 0.12; t < 1; t += 0.07) {
      const x = (1 - t) * (1 - t) * tx + 2 * (1 - t) * t * mx + t * t * ex, y = (1 - t) * (1 - t) * ty + 2 * (1 - t) * t * my + t * t * ey;
      const dx = 2 * (1 - t) * (mx - tx) + 2 * t * (ex - mx), dy = 2 * (1 - t) * (my - ty) + 2 * t * (ey - my), dl = Math.hypot(dx, dy);
      const nx = -dy / dl, ny = dx / dl, ll = fr * 0.2 * Math.sin(t * Math.PI) + 3;
      c.lineWidth = 3.2;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + nx * ll + dx / dl * ll * 0.4, y + ny * ll + dy / dl * ll * 0.4 + ll * 0.4); c.stroke();
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - nx * ll + dx / dl * ll * 0.4, y - ny * ll + dy / dl * ll * 0.4 + ll * 0.4); c.stroke();
    }
    c.strokeStyle = '#1a5e2c'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(mx, my, ex, ey); c.stroke();
  });
  c.fillStyle = '#5a3a1a';
  for (const [dx, dy] of [[-6, 6], [6, 7], [0, 12]]) { c.beginPath(); c.arc(tx + dx, ty + dy, 6, 0, TAU); c.fill(); }
}

function bush(c, x, y, s, flip) {
  const cols = ['#1f7a38', '#2e9b4a', '#46b35a'];
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.38 * (flip ? -1 : 1), len = (46 + (i % 3) * 12) * s;
    c.save(); c.translate(x, y); c.rotate(a);
    c.fillStyle = cols[i % 3];
    c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(len * 0.3, -len * 0.3, len * 0.8, -len * 0.25, len, 0);
    c.bezierCurveTo(len * 0.8, len * 0.25, len * 0.3, len * 0.3, 0, 0); c.fill();
    c.restore();
  }
  for (const [dx, dy, col] of [[-16, -30, '#ff3d6e'], [18, -44, '#ff6a3d'], [4, -18, '#ff3d6e']]) {
    const fx = x + dx * s * (flip ? -1 : 1), fy = y + dy * s;
    c.fillStyle = col;
    for (let p = 0; p < 5; p++) { const a = p / 5 * TAU; c.beginPath(); c.ellipse(fx + Math.cos(a) * 6 * s, fy + Math.sin(a) * 6 * s, 6 * s, 4 * s, a, 0, TAU); c.fill(); }
    c.fillStyle = '#ffe066'; c.beginPath(); c.arc(fx, fy, 2.4 * s, 0, TAU); c.fill();
  }
}

function woodTexture(ts) {
  const t = document.createElement('canvas');
  t.width = Math.ceil(W * ts); t.height = Math.ceil(H * ts);
  const c = t.getContext('2d'); c.scale(ts, ts);
  const rnd = mulberry(42), PW = 50;
  const base = ['#c98d52', '#b97c43', '#d39a5e', '#c0844a', '#cf9456', '#b57640', '#c88b50', '#d19860'];
  for (let p = 0; p < W / PW; p++) {
    const x0 = p * PW;
    c.fillStyle = base[p % base.length]; c.fillRect(x0, 0, PW, H);
    for (let k = 0; k < 16; k++) {
      const gx = x0 + rnd() * PW, amp = 1 + rnd() * 3, fq = 0.004 + rnd() * 0.01, ph = rnd() * 10;
      c.strokeStyle = rnd() < 0.7 ? `rgba(90,45,10,${0.08 + rnd() * 0.16})` : `rgba(255,220,170,${0.08 + rnd() * 0.1})`;
      c.lineWidth = 0.4 + rnd() * 1.4;
      c.beginPath();
      for (let y = 0; y <= H; y += 12) { const x = gx + Math.sin(y * fq + ph) * amp; y ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.stroke();
    }
    if (rnd() < 0.6) {
      const kx = x0 + 12 + rnd() * (PW - 24), ky = rnd() * H;
      for (let q = 5; q > 0; q--) { c.strokeStyle = `rgba(80,35,5,${0.1 + q * 0.03})`; c.lineWidth = 0.8; c.beginPath(); c.ellipse(kx, ky, q * 1.6, q * 4, 0, 0, TAU); c.stroke(); }
    }
    let y = -rnd() * 300;
    while (y < H) { y += 260 + rnd() * 260; c.fillStyle = 'rgba(60,25,5,.45)'; c.fillRect(x0, y, PW, 1.2); }
    c.fillStyle = 'rgba(50,20,0,.55)'; c.fillRect(x0, 0, 1.2, H);
    c.fillStyle = 'rgba(255,225,180,.18)'; c.fillRect(x0 + 1.2, 0, 1, H);
  }
  return t;
}

function buildScene() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext('2d'); c.scale(dpr, dpr);
  const rnd = mulberry(9);
  const hy = Tf - Math.max(30, (Tf) * 0.16);          // horizon
  const shore = Tf + (Tn - Tf) * 0.1;

  let g = c.createLinearGradient(0, 0, 0, hy);
  g.addColorStop(0, '#2aa7e6'); g.addColorStop(0.65, '#86d4f0'); g.addColorStop(1, '#dff5f2');
  c.fillStyle = g; c.fillRect(0, 0, vw, hy + 1);
  const sx = vw * 0.8, sy = Math.max(hy * 0.45, 90);
  g = c.createRadialGradient(sx, sy, 0, sx, sy, 130);
  g.addColorStop(0, 'rgba(255,252,225,1)'); g.addColorStop(0.2, 'rgba(255,240,180,.95)'); g.addColorStop(0.22, 'rgba(255,238,170,.45)'); g.addColorStop(1, 'rgba(255,238,170,0)');
  c.fillStyle = g; c.fillRect(sx - 130, sy - 130, 260, 260);
  cloud(c, vw * 0.2, Math.max(hy * 0.55, 130), 0.9); cloud(c, vw * 0.55, hy * 0.78, 0.6); cloud(c, vw * 0.95, hy * 0.72, 0.5);

  // island
  c.fillStyle = '#2f8f7e';
  c.beginPath(); c.ellipse(vw * 0.3, hy, 60, 14, 0, Math.PI, TAU); c.fill();
  c.fillStyle = '#26786a';
  c.beginPath(); c.ellipse(vw * 0.36, hy, 34, 22, 0, Math.PI, TAU); c.fill();

  // sea
  g = c.createLinearGradient(0, hy, 0, shore);
  g.addColorStop(0, '#1596b8'); g.addColorStop(0.6, '#2fc2cc'); g.addColorStop(1, '#7fe3d6');
  c.fillStyle = g; c.fillRect(0, hy, vw, shore - hy);
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.lineCap = 'round';
  for (let i = 0; i < 40; i++) { const x = rnd() * vw, y = hy + 3 + rnd() * (shore - hy - 6), l = 4 + rnd() * 14 * ((y - hy) / (shore - hy) + 0.3); c.beginPath(); c.moveTo(x, y); c.lineTo(x + l, y); c.stroke(); }
  g = c.createLinearGradient(0, hy - 4, 0, hy + 30); g.addColorStop(0, 'rgba(255,245,200,.0)'); g.addColorStop(0.2, 'rgba(255,245,200,.5)'); g.addColorStop(1, 'rgba(255,245,200,0)');
  c.fillStyle = g; c.fillRect(sx - 40, hy, 80, 30);

  // sand
  g = c.createLinearGradient(0, shore, 0, vh);
  g.addColorStop(0, '#f8e6b4'); g.addColorStop(1, '#ecc98a');
  c.fillStyle = g; c.fillRect(0, shore, vw, vh - shore);
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3;
  c.beginPath(); for (let x = 0; x <= vw; x += 8) { const y = shore + Math.sin(x * 0.05) * 2; x ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();

  // palms and plants behind the table
  const pb = Tf + (Tn - Tf) * 0.22, ph = Math.max(120, (pb - hy) * 1.15);
  palm(c, -vw * 0.01, pb, ph, vw * 0.11, rnd);
  palm(c, vw * 1.01, pb + 16, ph * 0.88, -vw * 0.1, rnd);
  bush(c, vw * 0.06, Tf + 24, 0.9, false);
  bush(c, vw * 0.94, Tf + 30, 0.85, true);

  // table drop shadow on sand
  const outer = [P(-RAIL, -RAIL), P(W + RAIL, -RAIL), P(W + RAIL, H + RAIL), P(-RAIL, H + RAIL)];
  c.save(); c.shadowColor = 'rgba(90,50,10,.5)'; c.shadowBlur = 26; c.shadowOffsetY = 14;
  c.fillStyle = '#6e3a1a'; poly(c, outer); c.fill(); c.restore();

  // table surface: warp the plank texture row by row for perspective
  const ts = U * dpr * 1.02, tex = woodTexture(ts);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  const r0 = Math.floor(Tf * dpr), r1 = Math.ceil(Tn * dpr);
  for (let py = r0; py < r1; py++) {
    const ya = clamp(yFromScreen(py / dpr), 0, H), yb = clamp(yFromScreen((py + 1) / dpr), 0, H);
    const s = sOf((ya + yb) / 2), left = (cx - W / 2 * U * s) * dpr, wd = W * U * s * dpr;
    c.drawImage(tex, 0, ya * ts, tex.width, Math.max(1, (yb - ya) * ts), left, py, wd, 1.6);
  }
  c.restore();
  const surf = [P(0, 0), P(W, 0), P(W, H), P(0, H)];
  c.save(); poly(c, surf); c.clip();
  g = c.createLinearGradient(0, Tf, 0, Tn);
  g.addColorStop(0, 'rgba(255,240,210,.22)'); g.addColorStop(0.4, 'rgba(255,240,210,0)'); g.addColorStop(1, 'rgba(60,25,0,.12)');
  c.fillStyle = g; c.fillRect(0, Tf, vw, Tn - Tf);
  g = c.createRadialGradient(cx + W * U * 0.25, Tf + (Tn - Tf) * 0.18, 0, cx + W * U * 0.25, Tf + (Tn - Tf) * 0.18, W * U * 0.5);
  g.addColorStop(0, 'rgba(255,250,230,.28)'); g.addColorStop(1, 'rgba(255,250,230,0)');
  c.fillStyle = g; c.fillRect(0, Tf, vw, Tn - Tf);
  c.fillStyle = 'rgba(70,30,0,.1)'; poly(c, [P(0, FOUL), P(W, FOUL), P(W, H), P(0, H)]); c.fill();
  c.restore();

  // rails
  const top = (x, y) => P(x, y, RAIL_H);
  const railTop = (pts) => {
    poly(c, pts);
    const gr = c.createLinearGradient(0, pts[0].y, 0, pts[2].y);
    gr.addColorStop(0, '#8a4a24'); gr.addColorStop(1, '#6b3417');
    c.fillStyle = gr; c.fill();
  };
  c.fillStyle = '#3f1c09'; poly(c, [top(0, 0), top(W, 0), P(W, 0), P(0, 0)]); c.fill();
  c.fillStyle = '#4a220d'; poly(c, [top(0, 0), top(0, H), P(0, H), P(0, 0)]); c.fill();
  poly(c, [top(W, 0), top(W, H), P(W, H), P(W, 0)]); c.fill();
  railTop([top(-RAIL, -RAIL), top(W + RAIL, -RAIL), top(W + RAIL, 0), top(-RAIL, 0)]);
  railTop([top(-RAIL, -RAIL), top(0, -RAIL), top(0, H + RAIL), top(-RAIL, H + RAIL)]);
  railTop([top(W, -RAIL), top(W + RAIL, -RAIL), top(W + RAIL, H + RAIL), top(W, H + RAIL)]);
  railTop([top(-RAIL, H), top(W + RAIL, H), top(W + RAIL, H + RAIL), top(-RAIL, H + RAIL)]);
  c.strokeStyle = 'rgba(255,215,170,.45)'; c.lineWidth = 1.5;
  poly(c, [top(0, 0), top(W, 0), top(W, H), top(0, H)]); c.stroke();
  c.strokeStyle = 'rgba(255,215,170,.25)';
  poly(c, [top(-RAIL, -RAIL), top(W + RAIL, -RAIL), top(W + RAIL, H + RAIL), top(-RAIL, H + RAIL)]); c.stroke();
  // front face
  const fa = top(-RAIL, H + RAIL), fb = top(W + RAIL, H + RAIL), fS = sOf(H + RAIL);
  const fd = BODY * U * fS + RAIL_H * U * fS;
  g = c.createLinearGradient(0, fa.y, 0, fa.y + fd);
  g.addColorStop(0, '#5e2d13'); g.addColorStop(0.45, '#4a220d'); g.addColorStop(0.5, '#3a1908'); g.addColorStop(1, '#2d1305');
  c.fillStyle = g; c.fillRect(fa.x, fa.y, fb.x - fa.x, fd);
}

/* ================= Layout ================= */
function layout() {
  vw = innerWidth; vh = innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  const ps = getComputedStyle(probe);
  const sat = parseFloat(ps.paddingTop) || 0, sab = parseFloat(ps.paddingBottom) || 0;
  const bottom = vh - Math.max(sab, 8) - 6;
  const minTop = sat + 150;                                  // leave sky for the scene + HUD
  const faceAllow = 34;
  const uW = Math.min(vw - 20, 560) / ((W + 2 * RAIL) * 1.01);
  const uH = (bottom - faceAllow - minTop) * (1 + TILT) / H;
  U = Math.max(0.3, Math.min(uW, uH));
  const ht = H * U / (1 + TILT);
  Tn = bottom - (BODY + RAIL_H + RAIL * 0.9) * U;
  Tf = Tn - ht;
  L = ht * (1 + TILT) / TILT;
  hz = Tn - L;
  cx = vw / 2;
  buildSprites(); buildScene(); drawNext();
}

function drawNext() {
  const px = Math.round(44 * dpr);
  nextCv.width = nextCv.height = px;
  const c = nextCv.getContext('2d'); c.clearRect(0, 0, px, px);
  const s = spr[nextLv]; if (!s) return;
  const d = px * (0.78 + nextLv * 0.08);
  c.drawImage(s.c, (px - d) / 2, (px - d) / 2, d, d);
}

/* ================= Game flow ================= */
function updateHud(bump) {
  scoreEl.textContent = score.toLocaleString();
  bestEl.textContent = 'Best ' + Math.max(best, score).toLocaleString();
  if (bump) { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); setTimeout(() => scoreEl.classList.remove('bump'), 130); }
}
function newHeld() { const r = LV[nextLv].r; held = { lv: nextLv, x: clamp(heldX, r, W - r), a: 0 }; nextLv = rndLv(); drawNext(); }
function reset() {
  items = []; spawned = []; particles = []; floaters = [];
  score = 0; cleared = 0; combo = 0; shots = 0; gameT = 0; lastLaunch = null; launchT = -10;
  heldX = W / 2; nextLv = rndLv(); held = null; newHeld();
  state = 'play'; overEl.classList.remove('show'); clearSave(); updateHud();
}
function gameOver() {
  if (state !== 'play') return;
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('fruitRinkBest', best); } catch (e) {} }
  document.getElementById('final').textContent = score.toLocaleString();
  document.getElementById('final-sub').textContent = (cleared ? `Watermelons cleared: ${cleared}. ` : '') + 'Best ' + best.toLocaleString();
  overEl.classList.add('show'); clearSave();
  tone(440, 0.25, 'triangle', 0.15, 0.7); tone(330, 0.4, 'triangle', 0.15, 0.6, 0.2);
}
function addScore(pts, x, y, big) {
  score += pts;
  floaters.push({ x, y, t: 0, text: '+' + pts.toLocaleString(), size: big ? 30 : 20, c: '#3a2413' });
  if (combo > 1) floaters.push({ x, y: y + (big ? 34 : 24), t: 0, text: 'Combo ×' + combo, size: 15, c: '#f2553d' });
  updateHud(true);
}
function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = spd * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.45 + Math.random() * 0.4, c: col, r: 2 + Math.random() * 3.5 });
  }
}
function launch(power) {
  const v = VMIN + (VMAX - VMIN) * power;
  const b = mkItem(held.lv, held.x, LAUNCH_Y, 0, -v); b.a = held.a;
  items.push(b);
  heldX = held.x; held = null; lastLaunch = b; launchT = gameT; combo = 0; shots++;
  tone(260 + power * 200, 0.12, 'sine', 0.12, 1.8);
}
function merge(a, b) {
  a.dead = b.dead = true; combo++;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  if (a.lv === TOP) {
    cleared++;
    burst(mx, my, LV[TOP].j, 40, 420); burst(mx, my, '#3fae3a', 20, 300); burst(mx, my, '#1a1a1a', 10, 250);
    addScore(3000 * combo, mx, my, true);
    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, 1, i * 0.07));
    return;
  }
  const lv = a.lv + 1;
  const n = mkItem(lv, 0, 0, (a.vx + b.vx) / 2 * MERGE_KEEP, (a.vy + b.vy) / 2 * MERGE_KEEP);
  n.x = clamp(mx, n.r, W - n.r); n.y = clamp(my, n.r, H - n.r);
  n.crossed = true; n.pop = 0; n.w = (a.w + b.w) / 2;
  for (const o of items) {
    if (o.dead) continue;
    const dx = o.x - n.x, dy = o.y - n.y, d = Math.hypot(dx, dy) || 1, reach = n.r + o.r + 6;
    if (d < reach) { const f = POP * (1.3 - d / reach) * n.m / (n.m + o.m); o.vx += dx / d * f; o.vy += dy / d * f; }
  }
  spawned.push(n);
  burst(n.x, n.y, LV[a.lv].j, 14 + lv * 2, 160 + lv * 15);
  addScore(Math.pow(2, lv + 1) * combo, n.x, n.y - n.r * 0.3, false);
  tone(300 * Math.pow(1.12, lv), 0.16, 'triangle', 0.18, 1.5);
}

/* ================= Physics ================= */
function step(dt) {
  gameT += dt;
  const backK = Math.exp(-BACK_DRAG * dt), dragK = Math.exp(-DRAG * dt), spinK = Math.exp(-2.5 * dt);
  for (const b of items) {
    if (b.vy > 0) b.vy *= backK;                         // sliding toward the player dies quickly
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 0) { let ns = sp * dragK - DECEL * dt; if (ns < STOP) ns = 0; const k = ns / sp; b.vx *= k; b.vy *= k; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.a += b.w * dt; b.w *= spinK;
    if (b.x < b.r) { b.x = b.r; if (b.vx < 0) { hitSound(-b.vx); b.vx = -b.vx * WALL_E; } }
    else if (b.x > W - b.r) { b.x = W - b.r; if (b.vx > 0) { hitSound(b.vx); b.vx = -b.vx * WALL_E; } }
    if (b.y < b.r) { b.y = b.r; if (b.vy < 0) { hitSound(-b.vy); b.vy = -b.vy * BACK_E; b.vx *= 0.85; } }
    else if (b.y > H - b.r) { b.y = H - b.r; if (b.vy > 0) { hitSound(b.vy); b.vy = -b.vy * FRONT_E; } }
    if (b.pop < 1) b.pop = Math.min(1, b.pop + dt / 0.18);
  }
  for (let pass = 0; pass < 2; pass++) {
    const n = items.length;
    for (let i = 0; i < n; i++) {
      const a = items[i]; if (a.dead) continue;
      for (let j = i + 1; j < n; j++) {
        const b = items[j]; if (b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r, d2 = dx * dx + dy * dy;
        if (d2 >= rs * rs) continue;
        if (a.lv === b.lv) { merge(a, b); break; }
        const d = Math.sqrt(d2) || 0.001, nx = dx / d, ny = dy / d, ov = rs - d, im = a.m + b.m;
        a.x -= nx * ov * (b.m / im); a.y -= ny * ov * (b.m / im);
        b.x += nx * ov * (a.m / im); b.y += ny * ov * (a.m / im);
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const jimp = -(1 + BALL_E) * vn / (1 / a.m + 1 / b.m);
          a.vx -= jimp / a.m * nx; a.vy -= jimp / a.m * ny;
          b.vx += jimp / b.m * nx; b.vy += jimp / b.m * ny;
          const vt = -rvx * ny + rvy * nx;                  // glancing hits add a bit of spin
          a.w += vt / a.r * 0.35 * b.m / im; b.w += vt / b.r * 0.35 * a.m / im;
          if (pass === 0) hitSound(-vn);
        }
      }
    }
    if (spawned.length || items.some(b => b.dead)) { items = items.filter(b => !b.dead).concat(spawned); spawned = []; }
  }
  for (const b of items) {
    if (!b.crossed && b.y < FOUL - b.r) b.crossed = true;
    const eligible = b.crossed || gameT - b.born > 2.0, slow = Math.hypot(b.vx, b.vy) < 40;
    if (eligible && b.y > FOUL && slow) b.danger += dt; else b.danger = Math.max(0, b.danger - dt * 2);
    if (b.danger > DANGER_T) { gameOver(); return; }
  }
  if (!held && state === 'play') {
    const li = lastLaunch, since = gameT - launchT;
    if (since > 0.3 && (!li || li.dead || li.y < FOUL - li.r || since > 1.1)) newHeld();
  }
}

/* ================= Input ================= */
function aimTo(sx) {
  if (!held) return;
  const r = LV[held.lv].r, s = sOf(LAUNCH_Y);
  held.x = clamp(W / 2 + (sx - cx) / (U * s), r, W - r); heldX = held.x;
}
cv.addEventListener('pointerdown', e => {
  unlockAudio();
  if (state !== 'play' || pointerId !== null) return;
  pointerId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { sy: e.clientY, pull: 0 };
  aimTo(e.clientX);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== pointerId || !drag) return;
  if (e.clientY < drag.sy) drag.sy = e.clientY;          // pull is measured from the highest point touched
  drag.pull = (e.clientY - drag.sy) / U;
  aimTo(e.clientX);                                      // aiming stays live while pulling
});
function endPointer(e, cancel) {
  if (e.pointerId !== pointerId) return;
  pointerId = null;
  if (!cancel && drag && held && state === 'play' && drag.pull >= MIN_PULL) launch(clamp((drag.pull - MIN_PULL) / (FULL_PULL - MIN_PULL), 0, 1));
  drag = null;
}
cv.addEventListener('pointerup', e => endPointer(e, false));
cv.addEventListener('pointercancel', e => endPointer(e, true));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

const restartBtn = document.getElementById('restart'); let armTimer = 0;
restartBtn.addEventListener('click', () => {
  unlockAudio();
  if (state !== 'play' || items.length === 0) { reset(); return; }
  if (restartBtn.classList.contains('armed')) { clearTimeout(armTimer); restartBtn.classList.remove('armed'); reset(); return; }
  restartBtn.classList.add('armed'); restartBtn.setAttribute('aria-label', 'Tap again to restart');
  armTimer = setTimeout(() => { restartBtn.classList.remove('armed'); restartBtn.setAttribute('aria-label', 'Restart game'); }, 2000);
});
function syncSound() {
  document.getElementById('snd-on').style.display = muted ? 'none' : '';
  document.getElementById('snd-off').style.display = muted ? '' : 'none';
}
document.getElementById('sound').addEventListener('click', () => {
  unlockAudio(); muted = !muted; syncSound();
  try { localStorage.setItem('fruitRinkMuted', muted ? '1' : '0'); } catch (e) {}
});
document.getElementById('again').addEventListener('click', () => { unlockAudio(); reset(); });

/* ================= Save / restore ================= */
function save() {
  if (state !== 'play') return;
  try {
    localStorage.setItem('fruitRinkSave', JSON.stringify({
      v: 2, score, cleared, nextLv, heldLv: held ? held.lv : rndLv(), heldX,
      items: items.map(b => [b.lv, +b.x.toFixed(1), +b.y.toFixed(1), +b.vx.toFixed(1), +b.vy.toFixed(1)])
    }));
  } catch (e) {}
}
function clearSave() { try { localStorage.removeItem('fruitRinkSave'); } catch (e) {} }
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem('fruitRinkSave') || 'null');
    if (!s || s.v !== 2) return false;
    score = s.score | 0; cleared = s.cleared | 0; heldX = s.heldX || W / 2;
    items = s.items.map(([lv, x, y, vx, vy]) => { const b = mkItem(lv, x, y, vx, vy); b.crossed = true; return b; });
    nextLv = s.heldLv; newHeld(); nextLv = s.nextLv; drawNext();
    shots = 1; updateHud(); return true;
  } catch (e) { return false; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); last = 0; });
window.addEventListener('pagehide', save);

/* ================= Render ================= */
const easeBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function drawFruit(lv, x, y, ang, k) {
  const p = P(x, y), s = spr[lv], R = s.R * U * p.s * k;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
  ctx.drawImage(s.c, -R, -R, R * 2, R * 2);
  ctx.restore();
  return p;
}
function drawShadow(lv, x, y, k) {
  const p = P(x, y), r = LV[lv].r * U * p.s * k;
  ctx.drawImage(shadowSpr, p.x - r * 1.05 + r * 0.12, p.y - r * 0.55 + r * 0.42, r * 2.1, r * 1.1);
}

function render(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let maxD = 0; for (const b of items) maxD = Math.max(maxD, b.danger);
  const pulse = maxD > 0 ? 0.5 + 0.5 * Math.sin(now / 70) : 0;
  const lw = 3 + pulse * 2;
  ctx.fillStyle = `rgba(226,52,48,${0.75 + 0.25 * pulse})`;
  poly(ctx, [P(0, FOUL - lw), P(W, FOUL - lw), P(W, FOUL + lw), P(0, FOUL + lw)]); ctx.fill();

  if (shots === 0 && state === 'play') {
    const p = P(W / 2, FOUL - 30);
    ctx.font = `700 ${Math.round(16 * U / 0.86)}px ui-rounded,system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(60,25,5,.45)'; ctx.fillText('Slide to aim. Pull down and let go.', p.x, p.y + 1.5);
    ctx.fillStyle = '#fff6e6'; ctx.fillText('Slide to aim. Pull down and let go.', p.x, p.y);
  }

  let power = 0;
  if (held && drag && state === 'play') {
    power = clamp((drag.pull - MIN_PULL) / (FULL_PULL - MIN_PULL), 0, 1);
    const r = LV[held.lv].r, x = held.x;
    let yEnd = r;
    for (const b of items) {
      const dx = Math.abs(b.x - x);
      if (dx < b.r + r && b.y < LAUNCH_Y) { const yc = b.y + Math.sqrt((b.r + r) ** 2 - dx * dx); if (yc > yEnd) yEnd = yc; }
    }
    const y0 = LAUNCH_Y - r - 4;
    if (yEnd < y0) {
      const a = P(x, y0), e = P(x, yEnd);
      ctx.setLineDash([7, 9]); ctx.lineDashOffset = -now / 25; ctx.lineWidth = 3;
      ctx.strokeStyle = `rgba(255,248,230,${0.45 + 0.45 * power})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(e.x, e.y); ctx.stroke();
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, r * U * e.s, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  const list = items.slice().sort((a, b) => a.y - b.y);
  for (const b of list) drawShadow(b.lv, b.x, b.y, b.pop < 1 ? Math.max(0.7, easeBack(b.pop)) : 1);
  let hp = null;
  if (held && state === 'play') {
    const r = LV[held.lv].r, pvMax = Math.max(0, H - r - LAUNCH_Y);
    hp = { x: held.x, y: LAUNCH_Y + (drag ? Math.min(pvMax, drag.pull * 0.3) : 0) };
    drawShadow(held.lv, hp.x, hp.y, 1);
  }
  for (const b of list) {
    const k = b.pop < 1 ? Math.max(0.7, easeBack(b.pop)) : 1;
    const p = drawFruit(b.lv, b.x, b.y, b.a, k);
    if (b.danger > 0) {
      ctx.strokeStyle = `rgba(226,52,48,${clamp(b.danger / DANGER_T, 0.3, 1)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (b.r + 4) * U * p.s, -Math.PI / 2, -Math.PI / 2 + TAU * (b.danger / DANGER_T)); ctx.stroke();
    }
  }
  if (hp) {
    const p = drawFruit(held.lv, hp.x, hp.y, held.a, 1);
    if (drag && drag.pull >= MIN_PULL) {
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.strokeStyle = `hsl(${55 - 55 * power},95%,${60 - 8 * power}%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, (LV[held.lv].r + 7) * U * p.s, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0.02, power)); ctx.stroke();
      ctx.lineCap = 'butt';
    }
  }

  for (const q of particles) {
    const p = P(q.x, q.y);
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, q.r * U * p.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    const p = P(f.x, f.y);
    ctx.globalAlpha = clamp((1 - f.t / 1.1) * 1.5, 0, 1);
    ctx.font = `800 ${Math.round(f.size * U / 0.86)}px ui-rounded,system-ui,sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,248,230,.95)';
    ctx.strokeText(f.text, p.x, p.y - f.t * 40); ctx.fillStyle = f.c; ctx.fillText(f.text, p.x, p.y - f.t * 40);
  }
  ctx.globalAlpha = 1;
}

/* ================= Loop ================= */
let last = 0, acc = 0; const STEP = 1 / 120;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
  if (state === 'play') { acc += dt; while (acc >= STEP) { step(STEP); acc -= STEP; if (state !== 'play') { acc = 0; break; } } }
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
  particles = particles.filter(p => p.t < p.life);
  for (const f of floaters) f.t += dt;
  floaters = floaters.filter(f => f.t < 1.1);
  render(t);
}
let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(layout, 60); });
syncSound(); layout();
if (!restore()) reset();
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
